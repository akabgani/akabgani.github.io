name: Sync arXiv papers

on:
  schedule:
    - cron: "17 6 * * *"
      timezone: "Europe/Brussels"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Find new arXiv papers
        run: python scripts/sync_arxiv.py --author "Alireza Kabgani"

      - name: Regenerate publication and news fragments
        run: python scripts/render_data.py

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- data/publications.yml data/news.yml generated/)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit new publication data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.yml data/news.yml generated/
          git commit -m "Auto-sync new arXiv publication"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Configure GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Set up Quarto
        if: steps.changes.outputs.changed == 'true'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        if: steps.changes.outputs.changed == 'true'
        run: quarto render

      - name: Upload Pages artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: needs.sync-build.outputs.changed == 'true'
    needs: sync-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
