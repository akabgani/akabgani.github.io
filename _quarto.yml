project:
  type: website
  output-dir: _site
  pre-render:
    - python scripts/render_data.py

website:
  title: "Alireza Kabgani"
  site-url: "https://akabgani.github.io"
  description: "Research in nonsmooth and nonconvex optimization, high-order methods, variational analysis, and optimization for machine learning."
  navbar:
    title: false
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: software.qmd
        text: Software & Projects
      - href: activities.qmd
        text: Activities
      - href: cv.qmd
        text: CV
    right:
      - icon: github
        href: https://github.com/akabgani
        aria-label: GitHub
      - text: ORCID
        href: https://orcid.org/0000-0001-6554-6969
      - text: DBLP
        href: https://dblp.org/pid/167/2062
  search: true
  page-footer:
    left: "© Alireza Kabgani"
    right: "Built with Quarto · Hosted on GitHub Pages"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    include-after-body: assets/site.js
